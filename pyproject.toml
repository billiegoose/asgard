[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asgard"
version = "0.1.0"
description = "Executable Python specification for Hilton's THOR graph reducer."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Billie" }]
dependencies = []

[project.scripts]
thor-spec = "thor_spec.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.17.1",
  "pytest>=8.4.1",
  "pytest-xdist>=3.8.0",
  "ruff>=0.12.9",
]

[tool.hatch.build.targets.wheel]
packages = ["models/python/thor_spec", "models/python/pypeline_red2"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["models/python", "tests"]
target-version = "py314"

[tool.ruff.lint]
select = [
  "B",
  "E",
  "F",
  "I",
  "N",
  "RUF",
  "UP",
  "W",
]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["models/python", "tests"]
