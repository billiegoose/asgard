[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asgard"
version = "0.1.0"
description = "Executable Python specification for Hilton's THOR graph reducer."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Billie" }]
dependencies = []

[project.scripts]
thor = "thor_interpreter.cli:main"
abs = "abstract_red2_machine.cli:main"
con = "concrete_red2_machine.cli:main"
compile = "thor_compile.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.17.1",
  "pytest>=8.4.1",
  "pytest-xdist>=3.8.0",
  "ruff>=0.12.9",
]

[tool.hatch.build.targets.wheel]
packages = [
  "models/thor_lang",
  "models/thor_compile",
  "models/thor_interpreter",
  "models/abstract_red2_machine",
  "models/concrete_red2_machine",
  "models/synthesizable_red2_machine",
]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["models", "tests"]
target-version = "py314"

[tool.ruff.lint]
select = [
  "B",
  "E",
  "F",
  "I",
  "N",
  "RUF",
  "UP",
  "W",
]

[tool.ruff.lint.per-file-ignores]
"models/synthesizable_red2_machine/machine.py" = ["N802"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["models", "tests"]
