[tools]
python = "3.14.7"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.thor]
description = "Run a THOR source file with the Python THOR model"
quiet = true
usage = '''
arg "<file>" help="THOR source file"
flag "--quantum <n>" help="maximum contraction quantum" default="2000"
flag "--verbose" help="write diagnostics to stderr"
flag "--clock <path>" help="latest-value clock source for CLOCK"
'''
run = '''
#!/bin/sh
if [ -t 0 ]; then
  saved_tty=$(stty -g); restore_tty() { stty "$saved_tty"; printf '\033[?25h'; }; trap restore_tty EXIT HUP INT TERM; stty -icanon -echo min 1 time 0
fi
uv run thor "${usage_file?}" --quantum "${usage_quantum?}" ${usage_verbose:+--verbose} ${usage_clock:+--clock "$usage_clock"}
exit $?
'''

[tasks.red2]
description = "Run a THOR source file with the Python RED2 model"
quiet = true
usage = '''
arg "<file>" help="THOR source file"
flag "--quantum <n>" help="maximum contraction quantum" default="2000"
flag "--verbose" help="write diagnostics to stderr"
flag "--clock <path>" help="latest-value clock source for CLOCK"
'''
run = '''
#!/bin/sh
if [ -t 0 ]; then
  saved_tty=$(stty -g); restore_tty() { stty "$saved_tty"; printf '\033[?25h'; }; trap restore_tty EXIT HUP INT TERM; stty -icanon -echo min 1 time 0
fi
uv run red2 "${usage_file?}" --quantum "${usage_quantum?}" ${usage_verbose:+--verbose} ${usage_clock:+--clock "$usage_clock"}
exit $?
'''

[tasks.rust]
description = "Compile a THOR source file and run it with the native Rust RED2 VM"
quiet = true
usage = '''
arg "<file>" help="THOR source file"
flag "--quantum <n>" help="maximum contraction quantum" default="5000"
flag "--clock <path>" help="latest-value clock source for CLOCK"
flag "--verbose" help="write diagnostics to stderr"
'''
run = '''
#!/bin/sh
if [ -t 0 ]; then
  saved_tty=$(stty -g); restore_tty() { stty "$saved_tty"; printf '\033[?25h'; }; trap restore_tty EXIT HUP INT TERM; stty -icanon -echo min 1 time 0
fi
INPUT_FILE="${usage_file}"
IMAGE_FILE="${INPUT_FILE%.thor}.red2"
uv run compile "$INPUT_FILE" --output "$IMAGE_FILE" >/dev/null 2>/dev/null || exit $?
cargo run -p red2-wasm --quiet -- "$IMAGE_FILE" --quantum "${usage_quantum?}" ${usage_clock:+--clock "$usage_clock"} ${usage_verbose:+--verbose}
exit $?
'''

[tasks.wasm]
description = "Compile a THOR source file and run it with the Wasmtime RED2 VM"
quiet = true
usage = '''
arg "<file>" help="THOR source file"
flag "--quantum <n>" help="maximum contraction quantum" default="5000"
flag "--clock <path>" help="latest-value clock source for CLOCK"
flag "--verbose" help="write diagnostics to stderr"
'''
run = '''
#!/bin/sh
if [ -t 0 ]; then
  saved_tty=$(stty -g); restore_tty() { stty "$saved_tty"; printf '\033[?25h'; }; trap restore_tty EXIT HUP INT TERM; stty -icanon -echo min 1 time 0
fi
INPUT_FILE="${usage_file}"
IMAGE_FILE="${INPUT_FILE%.thor}.red2"
uv run compile "$INPUT_FILE" --output "$IMAGE_FILE" >/dev/null 2>/dev/null || exit $?
cargo build -p red2-wasm --target wasm32-wasi --quiet || exit $?
wasmtime --dir "$(dirname "$IMAGE_FILE")" --dir "$(dirname "${usage_clock:-$tmp}")" target/wasm32-wasi/debug/red2-wasm.wasm "$IMAGE_FILE" --quantum "${usage_quantum?}" ${usage_clock:+--clock "$usage_clock"} ${usage_verbose:+--verbose}
exit $?
'''

[tasks.parity]
description = "Compare THOR and RED2 contraction-prefix behavior"
quiet = true
usage = '''
arg "<file>" help="THOR source file"
flag "--quantum <n>" help="maximum contraction quantum" default="2000"
'''
run = '''
uv run python - "${usage_file?}" "${usage_quantum?}" <<'PY'
from __future__ import annotations

import sys
from pathlib import Path

from thor_engine.lockstep import compare_prefixes, format_mismatch_report

source = Path(sys.argv[1]).read_text()
quantum = int(sys.argv[2])
result = compare_prefixes(source, max_quantum=quantum)
final = result.final_snapshot
if result.first_mismatch is None:
    print(
        "parity ok: "
        f"{len(result.snapshots)} prefix snapshot(s) matched through quantum {quantum}",
        file=sys.stderr,
    )
    if final is not None and final.thor:
        print(final.thor)
    raise SystemExit(0)
print(format_mismatch_report(result), file=sys.stderr, end="")
if final is not None and final.thor:
    print(final.thor)
raise SystemExit(0 if final is not None and final.matches else 1)
PY
'''

[tasks.hdl]
description = "Placeholder for future HDL execution"
quiet = true
usage = 'arg "<file>" help="THOR source file"'
run = 'echo "todo"'

[tasks.generate-video]
description = "Generate and upload one deterministic example recording"
usage = '''
arg "<video>" help="video fixture to record" {
  choices "breakout" "breakout-wasm"
}
flag "--no-upload" help="regenerate the local cast without uploading or updating the URL"
'''
run = 'uv run python tools/videos/generate.py "${usage_video?}" ${usage_no_upload:+--no-upload}'

[tasks.benchmark-breakout]
description = "Benchmark deterministic Breakout across THOR, RED2, Rust, and WASM backends"
usage = 'flag "--iterations <n>" help="samples per backend" default="3"'
run = 'uv run python tools/videos/benchmark_breakout.py --iterations "${usage_iterations}"'

[tasks.test]
description = "Run Python tests"
run = "uv run pytest -n 4 --dist loadfile"

[tasks.lint]
description = "Run Ruff"
run = "uv run ruff check ."

[tasks.typecheck]
description = "Run mypy"
run = "uv run mypy models/python tests"

[tasks.rust-test]
description = "Run Rust tests"
run = "cargo test -p red2-wasm"

[tasks.verify]
description = "Run all project verification gates"
depends = ["test", "lint", "typecheck", "rust-test"]
