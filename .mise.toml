[tools]
python = "3.14.7"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.thor]
description = "Run a THOR source file with the Python THOR model"
quiet = true
usage = '''
arg "<file>" help="THOR source file"
flag "--quantum <n>" help="maximum contraction quantum" default="2000"
flag "--verbose" help="write diagnostics to stderr"
flag "--clock <path>" help="latest-value clock source for CLOCK"
'''
run = '''
#!/bin/sh
if [ -t 0 ]; then
  saved_tty=$(stty -g); restore_tty() { stty "$saved_tty"; printf '\033[?25h'; }; trap restore_tty EXIT HUP INT TERM; stty -icanon -echo min 1 time 0
fi
uv run thor "${usage_file?}" --quantum "${usage_quantum?}" ${usage_verbose:+--verbose} ${usage_clock:+--clock "$usage_clock"}
exit $?
'''

[tasks.abs]
description = "Run a THOR source file on the Abstract RED2 Machine"
quiet = true
usage = '''
arg "<file>" help="THOR source file"
flag "--quantum <n>" help="maximum contraction quantum" default="2000"
flag "--memory-words <n>" help="abstract RED2 memory arena in words" default="1048576"
flag "--verbose" help="write diagnostics to stderr"
flag "--clock <path>" help="latest-value clock source for CLOCK"
flag "--recharge-on-host-dispatch" help="reset RED2 IO quantum after each host dispatch"
flag "--recharge-on-quantum-exhausted" help="reset RED2 IO quantum after external quantum exhaustion"
'''
run = '''
#!/bin/sh
if [ -t 0 ]; then
  saved_tty=$(stty -g); restore_tty() { stty "$saved_tty"; printf '\033[?25h'; }; trap restore_tty EXIT HUP INT TERM; stty -icanon -echo min 1 time 0
fi
recharge_args=""
if [ -n "${usage_recharge_on_host_dispatch:-}" ] || [ -n "${usage_recharge_on_quantum_exhausted:-}" ]; then
  [ -n "${usage_recharge_on_host_dispatch:-}" ] && recharge_args="$recharge_args --recharge-on host-dispatch"
  [ -n "${usage_recharge_on_quantum_exhausted:-}" ] && recharge_args="$recharge_args --recharge-on quantum-exhausted"
fi
uv run abs "${usage_file?}" --quantum "${usage_quantum?}" --memory-words "${usage_memory_words?}" ${usage_verbose:+--verbose} ${usage_clock:+--clock "$usage_clock"} $recharge_args
exit $?
'''

[tasks.con]
description = "Run a THOR source file on the Concrete RED2 Machine"
quiet = true
usage = '''
arg "<file>" help="THOR source file"
flag "--quantum <n>" help="maximum contraction quantum" default="2000"
flag "--verbose" help="write diagnostics to stderr"
'''
run = '''
uv run con "${usage_file?}" --quantum "${usage_quantum?}" ${usage_verbose:+--verbose}
'''

[tasks.syn]
description = "Run THOR source on the Synthesizable RED2 Machine simulator"
quiet = true
usage = '''
arg "[file]" help="THOR source file"
flag "--expr <source>" help="THOR expression or program source"
flag "--quantum <n>" help="maximum contraction quantum" default="2000"
flag "--verbose" help="write simulator diagnostics to stderr"
flag "--clock <path>" help="clock source (accepted now; host resume support is pending)"
'''
run = '''
uv run python scripts/run_syn.py ${usage_file:+"$usage_file"} ${usage_expr:+--expr "$usage_expr"} --quantum "${usage_quantum?}" ${usage_verbose:+--verbose} ${usage_clock:+--clock "$usage_clock"}
'''

[tasks.parity]
description = "Compare THOR and RED2 contraction-prefix behavior"
quiet = true
usage = '''
arg "<file>" help="THOR source file"
flag "--quantum <n>" help="maximum contraction quantum" default="2000"
'''
run = '''
uv run python - "${usage_file?}" "${usage_quantum?}" <<'PY'
from __future__ import annotations

import sys
from pathlib import Path

from thor_interpreter.lockstep import compare_prefixes, format_mismatch_report

source = Path(sys.argv[1]).read_text()
quantum = int(sys.argv[2])
result = compare_prefixes(source, max_quantum=quantum)
final = result.final_snapshot
if result.first_mismatch is None:
    print(
        "parity ok: "
        f"{len(result.snapshots)} prefix snapshot(s) matched through quantum {quantum}",
        file=sys.stderr,
    )
    if final is not None and final.thor:
        print(final.thor)
    raise SystemExit(0)
print(format_mismatch_report(result), file=sys.stderr, end="")
if final is not None and final.thor:
    print(final.thor)
raise SystemExit(0 if final is not None and final.matches else 1)
PY
'''

[tasks.hdl]
description = "Placeholder for future HDL execution"
quiet = true
usage = 'arg "<file>" help="THOR source file"'
run = 'echo "todo"'

[tasks.generate-video]
description = "Generate and upload one deterministic example recording"
usage = '''
arg "<video>" help="video fixture to record" {
  choices "breakout" "pong"
}
flag "--no-upload" help="regenerate the local cast without uploading or updating the URL"
'''
run = 'uv run python tools/videos/generate.py "${usage_video?}" ${usage_no_upload:+--no-upload}'

[tasks.benchmark]
description = "Run all canonical benchmarks and update benchmarks.md"
usage = """
flag "--warmups <n>" help="Python warmup samples per backend" default="1"
flag "--python-iterations <n>" help="Python measured samples per backend" default="5"
flag "--breakout-iterations <n>" help="Breakout samples per backend" default="3"
flag "--quantum <n>" help="THOR/RED2 contraction quantum" default="5000000"
flag "--cycle-limit <n>" help="faithful RED2 cycle limit" default="2000000"
"""
run = 'uv run python tools/benchmark.py --warmups "${usage_warmups}" --python-iterations "${usage_python_iterations}" --breakout-iterations "${usage_breakout_iterations}" --quantum "${usage_quantum}" --cycle-limit "${usage_cycle_limit}"'

[tasks.benchmark-breakout]
description = "Benchmark deterministic Breakout across THOR and RED2 backends"
usage = 'flag "--iterations <n>" help="samples per backend" default="3"'
run = 'uv run python tools/videos/benchmark_breakout.py --iterations "${usage_iterations}"'

[tasks.benchmark-python]
description = "Benchmark pure Python THOR and RED2 workloads with parity preflight"
usage = '''
flag "--benchmark <name>" help="workload to run" default="all" {
  choices "all" "tak" "list" "struct" "game"
}
flag "--warmups <n>" help="warmup samples per backend" default="1"
flag "--iterations <n>" help="measured samples per backend" default="5"
flag "--quantum <n>" help="THOR/RED2 contraction quantum" default="5000000"
flag "--cycle-limit <n>" help="faithful RED2 cycle limit" default="2000000"
'''
run = 'uv run python tools/benchmark_python_engines.py --benchmark "${usage_benchmark}" --warmups "${usage_warmups}" --iterations "${usage_iterations}" --quantum "${usage_quantum}" --cycle-limit "${usage_cycle_limit}"'

[tasks.test]
description = "Run the full Python test suite"
run = "uv run pytest -n 4 --dist loadfile"

[tasks.test-fast]
description = "Run Python tests excluding long-horizon stress coverage"
run = 'uv run pytest -n 4 --dist loadfile -m "not stress"'

[tasks.test-stress]
description = "Run only long-horizon stress coverage"
run = 'uv run pytest -n 4 --dist loadfile -m stress'

[tasks.lint]
description = "Run Ruff"
run = "uv run ruff check ."

[tasks.typecheck]
description = "Run mypy"
run = "uv run mypy models tests"

[tasks.verify]
description = "Run all project verification gates"
depends = ["test", "lint", "typecheck"]

[tasks.syn-check]
description = "Run the explicit Synthesizable RED2 Machine frontend+synthesis gate"
run = "uv run --with setuptools --with pyrtl==0.11.3 python scripts/check_syn.py"
